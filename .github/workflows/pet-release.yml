name: Pet fork sync and release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
      timezone: "Europe/Berlin"
  push:
    branches: [pet-composer-layout]

permissions:
  contents: read

# Hosted runners have their own admission queue. One release runs at a time;
# each isolated builder limits native compilation to four local CPU jobs.
concurrency:
  group: pet-release
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'imakris/codex'
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.candidate.outputs.base }}
      commit: ${{ steps.candidate.outputs.commit }}
      version: ${{ steps.candidate.outputs.version }}
      build: ${{ steps.candidate.outputs.build }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare an unpublished merge candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pet_release.py prepare
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: steps.candidate.outputs.build == 'true'
        with:
          name: pet-candidate
          path: candidate/
          if-no-files-found: error

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            platform: win32-x64
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: 4
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      NUM_JOBS: 4
      OPENSSL_BUILD_JOBS: 4
      BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_DEBUG: 0
      RUST_MIN_STACK: 8388608
      TARGET: ${{ matrix.target }}
      CODEX_REPO_ROOT: ${{ github.workspace }}
      STABLE_GIT_COMMIT: ${{ needs.prepare.outputs.commit }}
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pet-candidate
          path: candidate
      - name: Restore exact candidate
        run: python scripts/pet_release.py restore
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just,nextest
      - name: Restore Rust dependency cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: pet-${{ matrix.platform }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            pet-${{ matrix.platform }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-
            pet-${{ matrix.platform }}-
      - name: Set up Windows MSVC
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}
      - name: Verify Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:VCToolsInstallDir -notmatch '\\18\\' -or $env:VCToolsInstallDir -notmatch '\\14\.51\.') {
            throw "Expected Visual Studio 2026 / MSVC 14.51, got $env:VCToolsInstallDir"
          }
          Write-Host "Using $env:VCToolsInstallDir"
      - name: Install Zig for musl C++ dependencies
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.0
          use-cache: false
      - name: Set up musl dependencies
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-musl-build-tools.sh
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
      - name: Run release tooling tests
        run: python -m unittest discover -s scripts -p 'test_pet_*.py'
      - name: Build and hash Linux sandbox helper
        if: runner.os == 'Linux'
        working-directory: codex-rs
        run: |
          cargo build --locked --release --target "$TARGET" --jobs 4 --bin bwrap
          binary="target/$TARGET/release/bwrap"
          strip --strip-debug --strip-unneeded "$binary"
          echo "CODEX_BWRAP_SHA256=$(sha256sum "$binary" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Build canonical native package
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          extra=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            extra+=(--bwrap-bin "$GITHUB_WORKSPACE/codex-rs/target/$TARGET/release/bwrap")
          fi
          python scripts/build_codex_package.py --target "$TARGET" --cargo-profile release \
            --package-version "$PACKAGE_VERSION" --package-dir "$RUNNER_TEMP/pet-package" "${extra[@]}"
      - name: Run all required pet regression tests
        run: python scripts/pet_release.py test --target "$TARGET"
      - name: Package and smoke-test a clean npm installation
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python scripts/pet_package.py --target "$TARGET" --version "$PACKAGE_VERSION" \
            --package-dir "$RUNNER_TEMP/pet-package" --output-dir release-assets --smoke
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: pet-package-${{ matrix.platform }}
          path: release-assets/*.tgz
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          # Upstream workflow changes require Workflows write, unavailable to github.token.
          token: ${{ secrets.PET_SYNC_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pet-candidate
          path: candidate
      - name: Restore verified source
        run: python3 scripts/pet_release.py restore
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: pet-package-*
          path: release-assets
          merge-multiple: true
      - name: Promote source and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pet_release.py publish
